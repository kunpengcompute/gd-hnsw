minimum_pre_commit_version: 4.0.0
exclude: ^LICENSES/|^docs/|\.(md|html|csv|svg)$

default_stages: [pre-commit]
ci:
  autofix_prs: false
  autoupdate_schedule: monthly

repos:
  - repo: https://gitcode.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: ["--fix=lf"]
      - id: check-yaml
        args: ["--allow-multiple-documents"]
      - id: check-json
      - id: check-merge-conflict
      - id: detect-private-key
      - id: check-added-large-files

  - repo: https://gitcode.com/pre-commit-clang/mirrors-clang-format
    rev: v18.1.8
    hooks:
      - id: clang-format
        files: \.(c|h|cpp|hpp|cc|hh|cxx|hxx)$
        types_or: [c, c++]
        exclude: ^build/|^dist/

  # gitleaks：敏感信息/密钥扫描（golang 钩子，由 pre-commit 自动编译，需本机安装 Go）
  - repo: https://gitcode.com/GitHub_Trending/gi/gitleaks # 国内网络可使用gitcode镜像仓加速下载
    rev: v8.30.1
    hooks:
      - id: gitleaks
